<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RevisorDeures - Login</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
  <div class="login-container">
    <h1>RevisorDeures</h1>
    <p>Inicia sessió per continuar</p>
    
    <div class="error-message" id="errorMessage"></div>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="usuari">Usuari o email</label>
        <input type="text" id="usuari" name="usuari" required autocomplete="username">
      </div>
      
      <div class="form-group">
        <label for="password">Contrasenya</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      
      <button type="submit" class="btn-login">Entra</button>
    </form>
    
    <div class="info">
      <strong>Admin:</strong> usuari "admin" / contrasenya de l'entorn<br>
      <strong>Alumne:</strong> el teu email i contrasenya
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorMessage = document.getElementById('errorMessage');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMessage.style.display = 'none';
      
      const usuari = document.getElementById('usuari').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ usuari, password })
        });

        const data = await response.json();

        if (!response.ok) {
          errorMessage.textContent = data.error || 'Error en iniciar sessió';
          errorMessage.style.display = 'block';
          return;
        }

        // Redirigeix segons rol
        if (data.rol === 'admin') {
          window.location.href = '/admin';
        } else {
          window.location.href = '/alumne';
        }
      } catch (error) {
        errorMessage.textContent = 'Error de connexió amb el servidor';
        errorMessage.style.display = 'block';
        console.error('Error:', error);
      }
    });
  </script>
</body>
</html>
