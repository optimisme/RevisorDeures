<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RevisorDeures - Gestionari de Pràctiques</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <h1>RevisorDeures</h1>
      <nav>
        <a href="#practiques" class="nav-link active">Pràctiques</a>
        <a href="#entregues" class="nav-link">Entregues</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section id="practiques" class="active-section">
      <div class="section-header">
        <h2>Gestió de Pràctiques</h2>
        <button id="btn-nova-practica" class="btn btn-primary">Nova Pràctica</button>
      </div>
      
      <div id="practiques-list" class="list-container">
        <p class="loading">Carregant pràctiques...</p>
      </div>
    </section>

    <section id="practica-detail" class="hidden">
      <div class="detail-header">
        <h2 id="practica-nom"></h2>
        <button id="btn-tornar" class="btn btn-secondary">Tornar</button>
      </div>
      
      <div class="detail-content">
        <div class="form-section">
          <h3>Crear Nova Entrega</h3>
          <form id="form-entrega">
            <div class="form-group">
              <label for="url-repo">URL del Repositori GitHub:</label>
              <input type="url" id="url-repo" class="form-control" placeholder="https://github.com/usuario/repositori" required>
            </div>
            <button type="submit" class="btn btn-primary">Enviar Entrega</button>
          </form>
        </div>

        <div class="criteria-section">
          <h3>Criteris de la Pràctica</h3>
          <button id="btn-nou-criteri" class="btn btn-secondary">Nou Criteri</button>
          <div id="criteria-list" class="list-container">
            <p class="loading">Carregant criteris...</p>
          </div>
        </div>

        <div class="entregues-section">
          <h3>Entregues</h3>
          <div id="entregues-list" class="list-container">
            <p class="loading">Carregant entregues...</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2024 RevisorDeures</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
