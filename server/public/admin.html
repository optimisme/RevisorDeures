<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administració — RevisorDeures</title>  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="header">
    <h1>Administració — RevisorDeures</h1>
    <button class="logout-btn" id="logoutBtn">Tanca sessió</button>
  </div>

  <div class="error-message" id="errorMessage"></div>
  <div class="container" id="loading" class="loading">
    <p>Carregant...</p>
  </div>

  <div class="container" id="content" style="display: none;">
    <h2>Benvingut/da a la zona d'administració</h2>
    <p>Selecciona una opció per començar:</p>
    
    <div class="cards">
      <a href="/admin/alumnes" class="card">
        <div class="card-icon">👥</div>
        <h3>Gestió d'Alumnes</h3>
        <p>Afegir, editar i esborrar alumnes</p>
      </a>
      
      <a href="/admin/practiques" class="card">
        <div class="card-icon">📚</div>
        <h3>Gestió de Pràctiques</h3>
        <p>Configura les pràctiques i criteris</p>
      </a>
      
      <a href="/admin/entregues" class="card">
        <div class="card-icon">📋</div>
        <h3>Consulta d'Entregues</h3>
        <p>Revisa les entregues dels alumnes</p>
      </a>
    </div>
  </div>

  <script>
    // Verificar sessió
    async function checkSession() {
      try {
        const response = await fetch('/api/auth/session', { credentials: 'include' });
        const data = await response.json();

        if (!data || data.rol !== 'admin') {
          window.location.href = '/';
          return;
        }

        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
      } catch (error) {
        window.location.href = '/';
      }
    }

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      try {
        await fetch('/api/auth/logout', {
          method: 'POST',
          credentials: 'include'
        });
        window.location.href = '/';
      } catch (error) {
        window.location.href = '/';
      }
    });

    checkSession();
  </script>
</body>
</html>
