<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enviar Entrega — RevisorDeures</title>  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="header">
    <h1>Enviar Entrega</h1>
    <div class="header-actions">
      <a href="/alumne/entregues" class="nav-link">← Tornar a les entregues</a>
      <button class="logout-btn" id="logoutBtn">Tanca sessió</button>
    </div>
  </div>

  <div class="container">
    <div class="page-header">
      <h2>Nova entrega</h2>
    </div>

    <div class="error-message" id="errorMessage"></div>
    <div class="success-message" id="successMessage"></div>

    <div class="form-card" id="formContainer" style="display: none;">
      <form id="enviarForm">
        <div class="form-group">
          <label for="practicaSelect">Pràctica *</label>
          <select id="practicaSelect" required>
            <option value="">-- Tria una pràctica --</option>
          </select>
          <div class="form-hint">Selecciona la pràctica a la qual vols enviar l'entrega.</div>
        </div>

        <div class="form-group">
          <label for="repoUrl">URL del repositori GitHub *</label>
          <input type="url" id="repoUrl" required placeholder="https://github.com/owner/repo" autocomplete="off">
          <div class="form-hint">Introdueix l'URL completa del teu repositori GitHub (per exemple: https://github.com/usuario/repositori)</div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Enviar</button>
      </form>
    </div>

    <div class="loading" id="loading">Carregant formulari...</div>
  </div>

  <script>
    const enviarForm = document.getElementById('enviarForm');
    const practicaSelect = document.getElementById('practicaSelect');
    const repoUrlInput = document.getElementById('repoUrl');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');
    const formContainer = document.getElementById('formContainer');
    const loading = document.getElementById('loading');
    const submitBtn = document.getElementById('submitBtn');

    function showAlert(element, message) {
      element.textContent = message;
      element.style.display = 'block';
      setTimeout(() => { element.style.display = 'none'; }, 5000);
    }

    function showError(message) {
      showAlert(errorMessage, message);
      errorMessage.style.display = 'block';
    }

    function showSuccess(message) {
      showAlert(successMessage, message);
      successMessage.style.display = 'block';
    }

    function checkAuth() {
      return fetch('/api/auth/session', { credentials: 'include' })
        .then(res => res.json())
        .then(data => {
          if (!data || data.rol !== 'alumne') {
            window.location.href = '/';
          }
          return data;
        });
    }

    function loadPractiques() {
      return fetch('/api/practiques', { credentials: 'include' })
        .then(res => {
          if (res.status === 401 || res.status === 403) {
            window.location.href = '/';
          }
          return res.json();
        })
        .then(practiques => {
          practiques.forEach(practica => {
            const option = document.createElement('option');
            option.value = practica.id;
            option.textContent = practica.titol;
            practicaSelect.appendChild(option);
          });
        });
    }

    function validURLGitHub(url) {
      const regex = /^https:\/\/github\.com\/[^\/]+\/[^\/]+\/?$/;
      return regex.test(url);
    }

    // Validar URL en temps real
    repoUrlInput.addEventListener('input', () => {
      repoUrlInput.classList.remove('input-error');
      errorMessage.style.display = 'none';
    });

    // Submit
    enviarForm.addEventListener('submit', (e) => {
      e.preventDefault();
      errorMessage.style.display = 'none';
      successMessage.style.display = 'none';

      const practica_id = parseInt(practicaSelect.value);
      const repo_url = repoUrlInput.value.trim();

      if (!practica_id) {
        showError('Si us plau, selecciona una pràctica.');
        return;
      }

      if (!validURLGitHub(repo_url)) {
        repoUrlInput.classList.add('input-error');
        showError('Introdueix una URL GitHub vàida (per exemple: https://github.com/owner/repo)');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Enviant...';

      fetch('/api/entregues', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ practica_id, repo_url })
      })
      .then(res => res.json())
      .then(data => {
        if (res.status >= 400) {
          showError(data.error || 'Error en crear l\'entrega');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Enviar';
          return;
        }

        showSuccess('Entrega enviada correctament! Redirigint...');
        setTimeout(() => {
          window.location.href = '/alumne/entregues';
        }, 1500);
      })
      .catch(err => {
        showError('Error de connexió amb el servidor');
        console.error(err);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Enviar';
      });
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', () => {
      fetch('/api/auth/logout', { method: 'POST', credentials: 'include' }).finally(() => {
        window.location.href = '/';
      });
    });

    // Inicialitzar
    checkAuth()
      .then(() => {
        loadPractiques()
          .then(() => {
            loading.style.display = 'none';
            formContainer.style.display = 'block';
          });
      })
      .catch(() => {
        loading.textContent = 'Error carregant el formulari';
      });
  </script>
</body>
</html>
