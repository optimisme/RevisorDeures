<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Les meves Entregues — RevisorDeures</title>  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="header">
    <h1>Les meves Entregues</h1>
    <div class="header-actions">
      <a href="/alumne" class="nav-link">← Tornar a l'espai</a>
      <button class="logout-btn" id="logoutBtn">Tanca sessió</button>
    </div>
  </div>

  <div class="container">
    <div class="page-header">
      <h2>Les meves entregues</h2>
      <a href="/alumne/enviar" class="btn-primary">+ Nova Entrega</a>
    </div>

    <div class="error-message" id="errorMessage"></div>
    <div class="success-message" id="successMessage"></div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Pràctica</th>
            <th>URL del Repositori</th>
            <th>Estat</th>
            <th>Valoració</th>
            <th>Revisada</th>
            <th>Accions</th>
          </tr>
        </thead>
        <tbody id="entreguesTableBody">
          <tr>
            <td colspan="6" class="empty-state loading">Carregant entregues...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const entreguesTableBody = document.getElementById('entreguesTableBody');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');

    function showAlert(element, message) {
      element.textContent = message;
      element.style.display = 'block';
      setTimeout(() => { element.style.display = 'none'; }, 3000);
    }

    function checkAuth() {
      return fetch('/api/auth/session', { credentials: 'include' })
        .then(res => res.json())
        .then(data => {
          if (!data || data.rol !== 'alumne') {
            window.location.href = '/';
          }
          return data;
        });
    }

    function getEstatBadge(estat) {
      const map = {
        'pendent': 'pendent',
        'completada': 'completada',
        'error': 'error'
      };
      const cls = map[estat] || 'pendent';
      return `<span class="badge badge-${cls}">${estat}</span>`;
    }

    function getValoracioBadge(estat) {
      if (!estat || estat === 'pendent') {
        return `<span class="badge badge-pendent-val">Pendent</span>`;
      }
      if (estat === 'acceptada') {
        return `<span class="badge badge-acceptada">Acceptada</span>`;
      }
      if (estat === 'rebutjada') {
        return `<span class="badge badge-rebujada">Rebutjada</span>`;
      }
      return `<span class="badge badge-pendent-val">${estat}</span>`;
    }

    function loadEntregues() {
      return fetch('/api/entregues', { credentials: 'include' })
        .then(res => {
          if (res.status === 401) {
            window.location.href = '/';
          }
          return res.json();
        })
        .then(data => {
          const entregues = data.entregues || [];
          entreguesTableBody.innerHTML = '';

          if (entregues.length === 0) {
            entreguesTableBody.innerHTML = '<tr><td colspan="6" class="empty-state">No hi ha entregues. Fes clic a "Nova Entrega" per enviar-ne una.</td></tr>';
            return;
          }

          return Promise.all(entregues.map(entrega => {
            return fetch('/api/entregues/valoracions/entrega/' + entrega.id, { credentials: 'include' })
              .then(res => res.json())
              .then(valoracio => {
                return { entrega, valoracio: valoracio.valoracio || null };
              })
              .catch(() => ({ entrega, valoracio: null }));
          }));
        })
        .then(results => {
          if (!results) return;
          entreguesTableBody.innerHTML = '';

          results.forEach(({ entrega, valoracio }) => {
            const tr = document.createElement('tr');
            const revisadaText = entrega.revisada ? 'Sí' : 'No';
            const revisadaClass = entrega.revisada ? 'badge-si' : 'badge-no';

            let valoracioHTML = getValoracioBadge(valoracio ? valoracio.estat : null);
            if (valoracio && valoracio.comentaris) {
              valoracioHTML += '<div class="valoracio-detail">' + valoracio.comentaris.substring(0, 80) + (valoracio.comentaris.length > 80 ? '...' : '') + '</div>';
            }

            let actionsHTML = '';
            if (!entrega.revisada) {
              actionsHTML = `<button class="btn-action btn-delete" data-id="${entrega.id}" onclick="confirmDelete(${entrega.id})">Esborrar</button>`;
            }

            tr.innerHTML = `\
              <td>${entrega.practica_titol || 'Pràctica ' + entrega.practica_id}</td>\
              <td><a href="${entrega.repo_url}" target="_blank" rel="noopener">${entrega.repo_url}</a></td>\
              <td>${getEstatBadge(entrega.estat)}</td>\
              <td>${valoracioHTML}</td>\
              <td><span class="badge ${revisadaClass}">${revisadaText}</span></td>\
              <td class="actions">${actionsHTML}</td>\
            `;
            entreguesTableBody.appendChild(tr);
          });
        })
        .catch(err => {
          showAlert(errorMessage, 'Error carregant entregues');
          console.error(err);
        });
    }

    function confirmDelete(id) {
      if (confirm('Segur que vols esborrar aquesta entrega? Aquesta acció no es pot desfer.')) {
        deleteEntrega(id);
      }
    }

    function deleteEntrega(id) {
      fetch('/api/entregues/' + id, {
        method: 'DELETE',
        credentials: 'include'
      })
      .then(res => res.json())
      .then(data => {
        if (res.status === 404) {
          showAlert(errorMessage, 'Entrega no trobada');
          return;
        }
        showAlert(successMessage, 'Entrega esborrada correctament');
        loadEntregues();
      })
      .catch(err => {
        showAlert(errorMessage, 'Error esborrant entrega');
        console.error(err);
      });
    }

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', () => {
      fetch('/api/auth/logout', { method: 'POST', credentials: 'include' }).finally(() => {
        window.location.href = '/';
      });
    });

    // Inicialitzar
    checkAuth().then(() => loadEntregues());
  </script>
</body>
</html>
